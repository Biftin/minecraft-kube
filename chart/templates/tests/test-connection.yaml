apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "minecraft-server.fullname" . }}-test-connection"
  labels:
    {{- include "minecraft-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-c']
      args:
        - |
          echo "Testing Minecraft server connectivity..."
          # Test if the minecraft port is open and accepting connections
          timeout 10 sh -c 'until nc -z {{ include "minecraft-server.fullname" . }} {{ .Values.service.port }}; do sleep 1; done'
          if [ $? -eq 0 ]; then
            echo "✓ Minecraft server is accepting connections on port {{ .Values.service.port }}"
          else
            echo "✗ Failed to connect to Minecraft server"
            exit 1
          fi
          {{- if .Values.rcon.enabled }}
          # Test RCON connectivity
          timeout 10 sh -c 'until nc -z {{ include "minecraft-server.fullname" . }} {{ .Values.rcon.port }}; do sleep 1; done'
          if [ $? -eq 0 ]; then
            echo "✓ RCON is accepting connections on port {{ .Values.rcon.port }}"
          else
            echo "✗ Failed to connect to RCON"
            exit 1
          fi
          {{- end }}
